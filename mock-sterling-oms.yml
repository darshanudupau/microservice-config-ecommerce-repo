      defaultZone: http://localhost:8761/eureka/

springdoc:

  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

logging:

  level:
    root: INFO
    com.kodewala.mocksterling: DEBUG

inventory:

  base-url: http://localhost:8096
