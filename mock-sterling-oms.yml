server:
  port: 8094

spring:

  datasource:
    url: jdbc:mysql://localhost:3306/mock_sterling_db
    username: root
    password: darshan

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
