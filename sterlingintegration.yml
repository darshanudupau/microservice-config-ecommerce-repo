spring:
  datasource:
    url: jdbc:mysql://mysql:3306/sterlingdb
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.kodewala.sterling.integration: DEBUG

mock:
  sterling:
    base-url: http://mock-sterling-oms:8096
