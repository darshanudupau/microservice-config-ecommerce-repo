server:
  port: 8095

spring:
  application:
    name: sterlingintegration

  datasource:
    url: jdbc:mysql://mysql:3306/sterlingdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: darshan
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  cloud:
    openfeign:
      client:
        config:
          mock-sterling-oms:
            connectTimeout: 5000
            readTimeout: 10000
            loggerLevel: FULL

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: http://eureka-server:8761/eureka/

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  tracing:
    enabled: true

logging:

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

  level:
    root: INFO

    com.kodewala.sterling.integration: DEBUG

    feign: DEBUG

    org.springframework.cloud.openfeign: DEBUG

    org.hibernate.SQL: DEBUG

    org.hibernate.orm.jdbc.bind: TRACE

mock:
  sterling:
    base-url: http://localhost:8096

application:
  audit:
    enabled: true

  correlation:
    header-name: X-Correlation-ID

  oms:
    application-name: sterlingintegration
